# Generates Chatbot.xcodeproj. Run `xcodegen` after cloning or after adding files.
# Your team ID and bundle prefix go in Config/Local.xcconfig (see README).
name: Chatbot
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  ChatCore:
    path: ChatCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Chatbot:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Chatbot
    dependencies:
      - package: ChatCore
    settings:
      base:
        PRODUCT_NAME: Chatbot
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).chatbot
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/Chatbot-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Chatbot-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chatbot
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Voice mode listens to you so you can talk to the chat.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Voice mode turns what you say into text, on this device where possible.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
